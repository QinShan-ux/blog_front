@if (article(); as article) {
  <main class="container">

    <!-- 文章头部 -->
    <div class="post-header">
      <h1>{{ article.title }}</h1>
      <div class="post-meta">
        <span>{{ article.date }}</span>
        <span>{{ article.category }}</span>
        <span>{{ article.readTime }}</span>
      </div>
      <div class="post-tags">
        @for (tag of article.tags; track tag) {
          <span class="tag">{{ tag }}</span>
        }
      </div>
    </div>

    <!-- 文章正文 -->
    <article class="post-body" [innerHTML]="article.content"></article>

    <!-- 上一篇 / 下一篇 -->
    <div class="post-nav">
      @if (prevArticle(); as prev) {
        <a [routerLink]="'/post/' + prev.id" class="prev">
          <div class="nav-label">&larr; 上一篇</div>
          <div class="nav-title">{{ prev.title }}</div>
        </a>
      }
      @if (nextArticle(); as next) {
        <a [routerLink]="'/post/' + next.id" class="next">
          <div class="nav-label">下一篇 &rarr;</div>
          <div class="nav-title">{{ next.title }}</div>
        </a>
      }
    </div>

  </main>
}
